<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f0ff" />
    <meta name="description" content="Vigia 18+: prevenção, preparação e aprendizado para adultos." />
    <link rel="apple-touch-icon" href="/icons/vigia-brand.svg" />
    <link rel="icon" type="image/svg+xml" href="/icons/vigia-brand.svg" />
    <title>Vigia</title>
    <style>
      html{background:#f5f0ff}body{margin:0}.vigia-boot{min-height:100dvh;display:grid;place-content:center;justify-items:center;gap:16px;text-align:center;padding:24px;box-sizing:border-box;color:#352554;font-family:system-ui,sans-serif;background:radial-gradient(ellipse at 15% 15%,#fff3c8,transparent 48%),radial-gradient(ellipse at 90% 20%,#dbeaff,transparent 42%),linear-gradient(140deg,#f8f1ff,#f8faff)}.vigia-boot img{width:92px;height:101px;filter:drop-shadow(0 12px 18px #674ee331);animation:boot-turn 1.2s ease-out both,boot-float 5s ease-in-out 1.2s infinite}.vigia-boot strong{font-size:36px;letter-spacing:-1px}.vigia-boot p{margin:0;color:#716485;font-size:14px}@keyframes boot-turn{from{opacity:0;transform:perspective(600px) rotateY(-160deg) translateY(14px)}to{opacity:1;transform:perspective(600px) rotateY(0) translateY(0)}}@keyframes boot-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){.vigia-boot img{animation:none}}
    </style>
  </head>
  <body>
    <div id="root"><main class="vigia-boot" role="status"><img src="/icons/vigia-brand.svg" width="92" height="101" alt=""/><strong>Vigia</strong><p>Seu espaço de prevenção e aprendizado.</p><noscript>Ative o JavaScript no navegador para usar o aplicativo.</noscript></main></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
